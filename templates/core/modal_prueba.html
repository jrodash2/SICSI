<div class="modal fade" id="prueba-{{ modal_id }}" tabindex="-1" aria-labelledby="prueba-titulo-{{ modal_id }}" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h2 class="modal-title fs-5" id="prueba-titulo-{{ modal_id }}">Enviar correo de prueba</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div><div class="modal-body">Se enviará un mensaje de prueba a <strong>{{ correo }}</strong>. No se generarán alertas de servicios ni se incluirá información del acta.{% if not smtp_real %}<p class="mt-3 mb-0 text-warning-emphasis">El modo consola solo simula el mensaje; no entrega correo real.</p>{% endif %}</div><div class="modal-footer"><button class="btn btn-light" data-bs-dismiss="modal">Cancelar</button><form method="post" action="{% if destinatario_id %}{% url 'correo_prueba' destinatario_id %}{% else %}{% url 'correo_prueba_admin' %}{% endif %}" data-prevent-double-submit>{% csrf_token %}<button class="btn btn-primary">Confirmar prueba</button></form></div></div></div></div>
