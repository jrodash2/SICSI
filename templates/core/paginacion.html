{% if pagina.paginator.num_pages > 1 %}<nav aria-label="Páginas" class="p-3 d-flex gap-3 align-items-center">{% if pagina.has_previous %}<a class="btn btn-sm btn-light" href="?{% if consulta %}{{ consulta }}&amp;{% endif %}page={{ pagina.previous_page_number }}">← Anterior</a>{% endif %}<span class="small text-secondary">Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span>{% if pagina.has_next %}<a class="btn btn-sm btn-light" href="?{% if consulta %}{{ consulta }}&amp;{% endif %}page={{ pagina.next_page_number }}">Siguiente →</a>{% endif %}</nav>{% endif %}
