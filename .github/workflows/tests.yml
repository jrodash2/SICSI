name: Pruebas Django y PostgreSQL
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sicsi
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: sicsi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sicsi -d sicsi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - name: Preparar settings.py privado para pruebas
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import secrets
          source = Path("config/settings_example.py").read_text()
          source = source.replace('SECRET_KEY = ""', 'SECRET_KEY = ' + repr(secrets.token_urlsafe(48)))
          source = source.replace('"PASSWORD": ""', '"PASSWORD": "ci-test-only"')
          Path("config/settings.py").write_text(source)
          PYCODE
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
